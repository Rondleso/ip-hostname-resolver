# Lookup definition for the IP <-> Hostname table.
# The CSV (lookups/ip_hostname_correlation_lookup.csv) starts with only the header:
#   IpAddress,Hostname
# and is filled by the scheduled report in spl/01_correlation_report.spl.

[ip_hostname_correlation_lookup]
filename = ip_hostname_correlation_lookup.csv
# Hostnames appear in different cases across sources
case_sensitive_match = false
