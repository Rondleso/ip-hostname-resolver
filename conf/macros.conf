# Resolver macros. Both write src_resolved / dst_resolved and never modify the original IP fields.
# Adapt the coalesce field lists in the first line to the IP fields in your environment.
# Inline SPL comments are left out here on purpose (see spl/02_macros.spl for the annotated version).

# Event-based alerts:  | `ip_hostname_resolver`
[ip_hostname_resolver]
definition = eval tmp_src=coalesce(src_ip, IpAddress, LocalAddress, src), tmp_dst=coalesce(dst_ip, RemoteAddress) \
| lookup ip_hostname_correlation_lookup IpAddress AS tmp_src OUTPUTNEW Hostname AS src_resolved \
| lookup ip_hostname_correlation_lookup Hostname AS tmp_src OUTPUTNEW IpAddress AS src_resolved \
| lookup ip_hostname_correlation_lookup IpAddress AS tmp_dst OUTPUTNEW Hostname AS dst_resolved \
| lookup ip_hostname_correlation_lookup Hostname AS tmp_dst OUTPUTNEW IpAddress AS dst_resolved \
| eval src_resolved=coalesce(src_resolved, tmp_src), dst_resolved=coalesce(dst_resolved, tmp_dst) \
| fields - tmp_src, tmp_dst
iseval = 0

# Datamodel/tstats alerts:  | `ip_hostname_resolver(Authentication)`
[ip_hostname_resolver(1)]
args = dm
definition = eval tmp_src=coalesce('$dm$.src', '$dm$.src_ip', src_ip, IpAddress), tmp_dst=coalesce('$dm$.dest', '$dm$.dest_ip', dst_ip, target_ips) \
| lookup ip_hostname_correlation_lookup IpAddress AS tmp_src OUTPUTNEW Hostname AS src_resolved \
| lookup ip_hostname_correlation_lookup Hostname AS tmp_src OUTPUTNEW IpAddress AS src_resolved \
| lookup ip_hostname_correlation_lookup IpAddress AS tmp_dst OUTPUTNEW Hostname AS dst_resolved \
| lookup ip_hostname_correlation_lookup Hostname AS tmp_dst OUTPUTNEW IpAddress AS dst_resolved \
| eval src_resolved=coalesce(src_resolved, tmp_src), dst_resolved=coalesce(dst_resolved, tmp_dst) \
| fields - tmp_src, tmp_dst
iseval = 0
